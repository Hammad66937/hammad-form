<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Saved Data</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back {
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        .delete {
            background: #dc2626;
            color: white;
            text-decoration: none;
            padding: 7px 10px;
            border-radius: 5px;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #666;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="top">

        <h1>Saved Data</h1>

        <a class="back" href="/">
            Add New
        </a>

    </div>

    {% if users %}

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Message</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

            {% for user in users %}

            <tr>

                <td>{{ user["id"] }}</td>

                <td>{{ user["name"] }}</td>

                <td>{{ user["email"] }}</td>

                <td>{{ user["phone"] }}</td>

                <td>{{ user["message"] }}</td>

                <td>
                    <a
                        class="delete"
                        href="/delete/{{ user['id'] }}"
                        onclick="return confirm('Delete this record?');"
                    >
                        Delete
                    </a>
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

    {% else %}

    <div class="empty">
        <h3>No data found</h3>
        <p>Submit the form to add a record.</p>
    </div>

    {% endif %}

</div>

</body>

</html>
